```html
<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>Insert title here</title>

    <link rel="stylesheet" type="text/css" href="css/basic.css" />

    <style type="text/css">
        .poster {
            width: 150px;
            height: 150px;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <button name="delItem">삭제</button>

    <hr>

    <article class="main">

        <section>
            <table width="80%" align="center">

                <caption class="caption">찜 리스트</caption>

                <thead>
                    <tr>
                        <th>이미지</th>
                        <th>상품번호</th>
                        <th>상품이름</th>
                        <th>가격</th>
                        <th>삭제</th>
                    </tr>
                </thead>

                <tbody id="content">
                    <!-- 찜목록 출력 -->
                </tbody>

            </table>
        </section>


        <section class="toalprice" id="price">
            <!-- 가격 -->
        </section>


        <section class="link">
            <table align="center">
                <tr>
                    <td align="center">
                        <a href="">주문하러 가기</a>
                        <a href="index.html">DVD LIST</a>
                    </td>
                </tr>
            </table>
        </section>

    </article>


    <script>

        // localStorage에서 찜 목록 가져오기
        const cart =
            JSON.parse(localStorage.getItem("cart")) || [];

        // DOM 요소
        const cartList = document.getElementById("content");
        const price = document.getElementById("price");
        const delItem = document.querySelector("[name='delItem']");

        let totalPrice = 0;


        // =========================
        // 찜 목록 출력
        // =========================
        cart.forEach(function (movie) {

            totalPrice += movie.price;

            cartList.innerHTML += `
                <tr>
                    <td>
                        <img src="${movie.image}" class="poster">
                    </td>

                    <td>
                        ${movie.id}
                    </td>

                    <td>
                        ${movie.title}
                    </td>

                    <td>
                        ${movie.price.toLocaleString()}원
                    </td>

                    <td>
                        <button onclick="deleteMovie('${movie.id}')">
                            삭제
                        </button>
                    </td>
                </tr>
            `;
        });


        // =========================
        // 총 가격 출력
        // =========================
        price.innerHTML =
            "총 가격: " + totalPrice.toLocaleString() + "원";


        // =========================
        // 개별 영화 삭제
        // =========================
        function deleteMovie(id) {

            let cart =
                JSON.parse(localStorage.getItem("cart")) || [];

            cart = cart.filter(function (movie) {
                return movie.id !== id;
            });

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            location.reload();
        }


        // =========================
        // 전체 찜 목록 삭제
        // =========================
        delItem.addEventListener("click", function () {

            localStorage.removeItem("cart");

            location.reload();
        });

    </script>

</body>

</html>
```
